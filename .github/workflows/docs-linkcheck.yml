name: Docs Link Check

# Validates external links in the documentation (including readthedocs.io).
# Runs on a weekly schedule instead of on every push/PR so regular CI does not
# make outbound network requests on each run. Can also be triggered manually.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
      with:
        python-version: "3.11"

    - name: Check documentation links
      run: |
        uv sync --no-default-groups --group docs
        uv run python -m sphinx -b linkcheck docs docs/_build/linkcheck
