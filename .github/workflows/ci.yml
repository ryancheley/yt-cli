name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# Cancel superseded runs on the same ref so new pushes don't queue behind stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full gate runs on PRs only; branch protection requires up-to-date branches,
    # so the exact merge state is already tested before it lands on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.15 (and its free-threaded build 3.15t) now have prebuilt wheels for
        # the native deps (cryptography, cffi, pydantic-core), so they install
        # fast enough to run in the per-PR matrix (#794).
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies and run tests with tox-uv
      run: uvx --with tox-uv tox -e py$(echo ${{ matrix.python-version }} | tr -d '.')

    - name: Rename coverage data for this Python version
      run: mv .coverage ".coverage.${{ matrix.python-version }}"

    - name: Upload coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-data-${{ matrix.python-version }}
        path: .coverage.${{ matrix.python-version }}
        include-hidden-files: true

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: "3.11"

    - name: Run lint with tox-uv
      run: uvx --with tox-uv tox -e lint

  type-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: "3.11"

    - name: Run type check with tox-uv
      run: uvx --with tox-uv tox -e type

  security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: "3.11"

    - name: Run security check
      run: uvx zizmor .github/workflows/

  documentation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
      with:
        python-version: "3.11"

    - name: Install dependencies and build documentation
      run: |
        uv sync --no-default-groups --group docs
        uv run python -c "import sphinx; print('Sphinx version:', sphinx.__version__)"
        uv run python -m sphinx -b html docs docs/_build/html --keep-going
        uv run python -m sphinx -b doctest docs docs/_build/doctest
        echo "Documentation testing infrastructure is in place"
        echo "RST files found:" && find docs/ -name "*.rst" | wc -l

  # Aggregate coverage across the test matrix and enforce the project threshold
  # in-CI (replaces the former external coverage service). Runs even if a matrix
  # job failed so a report is always produced; the failing test job still fails
  # the summary gate below.
  coverage:
    name: coverage
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v4
      with:
        version: "latest"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Download coverage data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: coverage-data-*
        merge-multiple: true

    - name: Combine coverage, report to summary, and enforce threshold
      run: |
        uv tool install coverage

        coverage combine
        coverage html --skip-covered --skip-empty

        # Write a markdown report to the run summary (never fail this line, so the
        # summary is present even when the gate below fails).
        coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

        # Enforce the threshold. No --fail-under here: coverage reads
        # [tool.coverage.report] fail_under (currently 60) from pyproject.toml.
        coverage report

    - name: Upload HTML report if the coverage gate failed
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() }}
      with:
        name: html-report
        path: htmlcov

  # Summary job for branch protection (PR-only; pushes are not gated)
  tests-complete:
    name: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, lint, type-check, security, documentation, coverage]
    steps:
      - name: Check all jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$TEST_RESULT" == "success" &&
                "$LINT_RESULT" == "success" &&
                "$TYPE_CHECK_RESULT" == "success" &&
                "$SECURITY_RESULT" == "success" &&
                "$DOCUMENTATION_RESULT" == "success" &&
                "$COVERAGE_RESULT" == "success" ]]; then
            echo "All checks passed"
            exit 0
          else
            echo "Some checks failed"
            exit 1
          fi
