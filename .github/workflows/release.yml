name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  test-pypi:
    runs-on: ubuntu-latest
    environment: TestPyPI
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "latest"
        enable-cache: false

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest

    - name: Build package
      run: uv build

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  pypi:
    runs-on: ubuntu-latest
    environment: PyPI
    needs: test-pypi
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "latest"
        enable-cache: false

    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      # Idempotent: if the release already exists (e.g. the tag was created via
      # `gh release create`, or this is a re-run), upload the build artifacts to
      # it instead of failing. Otherwise create the release as usual.
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists; uploading build artifacts to it."
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --verify-tag --generate-notes
        fi
